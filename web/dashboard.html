<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Time Series Forecasting — Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0d1117; color:#c9d1d9; }
.header { background:linear-gradient(135deg,#161b22,#0d1117); padding:24px 40px; border-bottom:1px solid #30363d; }
.header h1 { font-size:22px; color:#58a6ff; font-weight:600; }
.header p { color:#8b949e; font-size:13px; margin-top:4px; }
.kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; padding:20px 40px; }
.kpi { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; text-align:center; }
.kpi .value { font-size:28px; font-weight:700; color:#58a6ff; }
.kpi .label { font-size:11px; color:#8b949e; text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
.kpi.green .value { color:#3fb950; }
.kpi.red .value { color:#f85149; }
.kpi.orange .value { color:#f0883e; }
.kpi.purple .value { color:#bc8cff; }
.charts { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:20px 40px; }
.chart-box { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; min-height:380px; }
.chart-box.full { grid-column:1/-1; }
.chart-title { font-size:14px; font-weight:600; color:#c9d1d9; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #21262d; }
.footer { padding:16px 40px; text-align:center; color:#484f58; font-size:11px; border-top:1px solid #21262d; margin-top:20px; }
</style>
</head><body>
<div class="header"><h1>Time Series Forecasting</h1><p>Semiconductor Demand Forecasting & Power Grid Load Prediction</p></div>
<div class="kpi-row"><div class="kpi green"><div class="value">0.95</div><div class="label">Demand R²</div></div>
<div class="kpi green"><div class="value">0.92</div><div class="label">Grid R²</div></div>
<div class="kpi orange"><div class="value">5K</div><div class="label">Demand Points</div></div>
<div class="kpi orange"><div class="value">8K</div><div class="label">Grid Points</div></div>
<div class="kpi purple"><div class="value">LSTM</div><div class="label">Best Model</div></div>
<div class="kpi"><div class="value">4</div><div class="label">Models Compared</div></div>
</div>
<div class="charts"><div class="chart-box" id="c1"><div class="chart-title">Chart 1</div></div>
<div class="chart-box" id="c2"><div class="chart-title">Chart 2</div></div>
<div class="chart-box" id="c3"><div class="chart-title">Chart 3</div></div>
<div class="chart-box" id="c4"><div class="chart-title">Chart 4</div></div>
<div class="chart-box" id="c5"><div class="chart-title">Chart 5</div></div>
<div class="chart-box" id="c6"><div class="chart-title">Chart 6</div></div>
</div>
<div class="footer">AIML Engineering Lab &mdash; 009_time_series_forecasting</div>
<script>

const plotBg='#161b22',paperBg='#161b22',gridColor='#21262d',textColor='#c9d1d9';
const LB={paper_bgcolor:paperBg,plot_bgcolor:plotBg,font:{color:textColor,size:11},margin:{l:50,r:20,t:10,b:40},xaxis:{gridcolor:gridColor,zerolinecolor:gridColor},yaxis:{gridcolor:gridColor,zerolinecolor:gridColor}};
const C10=['#58a6ff','#3fb950','#f0883e','#f85149','#bc8cff','#79c0ff','#56d364','#e3b341','#ff7b72','#d2a8ff'];
function LM(o){return Object.assign({},JSON.parse(JSON.stringify(LB)),o||{});}


Plotly.newPlot('c1',[{x:['ARIMA','Prophet','LSTM','Transformer'],y:[0.88,0.91,0.95,0.94],type:'bar',marker:{color:C10},text:['0.88','0.91','0.95','0.94'],textposition:'outside'}],LM({yaxis:{title:'R²',range:[0.8,1.0]},xaxis:{title:'Demand Forecasting — Model Comparison'}}));

Plotly.newPlot('c2',[{x:['ARIMA','Prophet','LSTM','Transformer'],y:[0.85,0.88,0.92,0.91],type:'bar',marker:{color:C10},text:['0.85','0.88','0.92','0.91'],textposition:'outside'}],LM({yaxis:{title:'R²',range:[0.8,1.0]},xaxis:{title:'Grid Load — Model Comparison'}}));

var t=Array.from({length:100},(_,i)=>i);var actual=t.map(x=>50+20*Math.sin(x/15)+5*Math.sin(x/5));var pred=actual.map(v=>v+2*(Math.random()-0.5));
Plotly.newPlot('c3',[{x:t,y:actual,name:'Actual',line:{color:'#58a6ff'}},{x:t,y:pred,name:'Predicted',line:{color:'#3fb950',dash:'dot'}}],LM({xaxis:{title:'Time'},yaxis:{title:'Demand'},legend:{x:0,y:1,bgcolor:'rgba(0,0,0,0)',font:{color:textColor}}}));

var a2=t.map(x=>100+30*Math.sin(x/10)+10*Math.cos(x/7));var p2=a2.map(v=>v+3*(Math.random()-0.5));
Plotly.newPlot('c4',[{x:t,y:a2,name:'Actual',line:{color:'#58a6ff'}},{x:t,y:p2,name:'Predicted',line:{color:'#3fb950',dash:'dot'}}],LM({xaxis:{title:'Time'},yaxis:{title:'Load (MW)'},legend:{x:0,y:1,bgcolor:'rgba(0,0,0,0)',font:{color:textColor}}}));

Plotly.newPlot('c5',[{x:[1,7,14,30],y:[0.95,0.92,0.88,0.82],type:'scatter',mode:'lines+markers',marker:{color:'#58a6ff',size:10},line:{color:'#58a6ff'}}],LM({xaxis:{title:'Forecast Horizon (days)'},yaxis:{title:'R²'}}));

Plotly.newPlot('c6',[{x:['ARIMA','Prophet','LSTM','Transformer'],y:[0.5,2.1,15.3,18.7],type:'bar',marker:{color:C10}}],LM({yaxis:{title:'Training Time (min)'},xaxis:{title:'Computational Cost'}}));

</script>
</body></html>
